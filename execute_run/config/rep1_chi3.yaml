sysSpec:
  M_cav: 3
  M_em: 0
  N_exc_list:
  - 4
  - 5
para:
  custom: False
  N_steps: 640
  key_seed: 5   #we used seed 5
  tau: 
    offset: 0.0
    noise: 0.0
  delta_cav:
    offset: 1.0
    noise: 0.01
  delta_em: 
    offset: 0.0
    noise: 3.0
  kappa: 
    offset: 0.0
    noise: 0.01
  coeff_vec: 
    offset: 1.0
    noise: 0.0
  S_in_Rmat:
    offset: 0.0
    noise: 0.0
amp:
  custom: False
  N_steps: 640 #number of time pieces
  max_tau: 0.0080
  min_tau: 0.0079
  delta_cav:
    shape: uniform
    amp_physical: 10.0
    ramp_up_speed_physical: 1.0
  delta_em:
    shape: uniform
    amp_physical: 10.0
    ramp_up_speed_physical: 1.0
    offset_shape: uniform
    offset_size_physical: 0.0
  kappa:
    shape: uniform
    amp_physical: 10.0
    ramp_up_speed_physical: 1.0

opti:
  QIPtrans: 1loss 3cav repeater
  include_time_evolution: True
  include_mode_evolution: False
  solver: Expm
  jit_stepper: True
  GPU: False         # determines which virtual environment we use
  cost:
    inf: 1.0
    time: 0.0
    bw_deltacav: 0.006
    bw_kappa: 0.020
    bw_deltaem: 0.0
  optimizer:
    type: adam
    parameters:
      lr: 0.01
      b1: 0.999
      b2: 0.999
    mask:
      tau: False
      delta_cav: True
      kappa: True
      delta_em: True
      coeff_vec: False
      S_in_Rmat: False
  training:
    epochs: 30000
    plot_period: 30000
    plot_periodically: True
    log_wandb: True
    cost_tol: 0.000001
    log_inf_tol: 0.000001
    epoch_interval: 500
    inf_tol: 0.0005
    approach_continuous: False
wandbSpec:
  project: rqpnn-final
  group: rep1_chi3
  sweep_name: '1loss repeater M_em: 0'
